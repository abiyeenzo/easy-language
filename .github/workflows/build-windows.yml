name: Build Windows (C, cross-compilation)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer mingw-w64 (cross-compilation Windows depuis Linux)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Compiler l'interpreteur natif (verification rapide)
        run: cd c && make linux

      - name: Verifier les exemples (sortie non vide, code de sortie 0)
        run: |
          cd c
          for f in ../exemples/*.elg; do
            echo "--- $f ---"
            printf "Alice\n25\n" | ./easy_language "$f"
          done

      - name: Cross-compiler pour Windows (interpreteur + debogueur + editeur)
        run: cd c && make windows

      - name: Preparer le paquet de distribution
        run: |
          mkdir -p dist_windows
          cp c/easy_language.exe c/easy_debogueur.exe c/easy_editeur.exe dist_windows/
          cp -r exemples dist_windows/
          cp README.md GUIDE_UTILISATEUR.md CHANGELOG.md dist_windows/
          cd dist_windows && zip -r ../EasyLanguage-windows.zip .

      - name: Publier le paquet comme artefact de build
        uses: actions/upload-artifact@v4
        with:
          name: easy-language-windows
          path: EasyLanguage-windows.zip

      - name: Creer la release GitHub (uniquement sur un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EasyLanguage-windows.zip

name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tests-et-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lancer les tests unitaires
        run: python -m unittest discover -v

      - name: Installer PyInstaller
        run: pip install pyinstaller

      - name: Construire l'interpreteur (easy_language.exe)
        run: pyinstaller --onefile --name easy_language main.py

      - name: Construire l'editeur (easy_language_editeur.exe)
        run: pyinstaller --onefile --windowed --name easy_language_editeur editeur.py

      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compiler l'installateur Windows
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installateur.iss'

      - name: Publier les binaires comme artefacts de build
        uses: actions/upload-artifact@v4
        with:
          name: easy-language-windows
          path: |
            dist/easy_language.exe
            dist/easy_language_editeur.exe
            Output/EasyLanguageSetup.exe

      - name: Creer la release GitHub (uniquement sur un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/easy_language.exe
            dist/easy_language_editeur.exe
            Output/EasyLanguageSetup.exe
